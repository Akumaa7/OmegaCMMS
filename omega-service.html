<script>
/* CONFIGURAÇÃO DO SUPABASE: preencha para ligar o servidor (a página publicada no Claude bloqueia
   chamadas externas, então lá o app roda no modo offline). Tabelas: veja supabase-setup.sql */
const SUPABASE_URL='https://uajvhqtxeuetsogwwthj.supabase.co',SUPABASE_KEY='sb_publishable_losiVEx5DBQZ0dJ4utRChg_qHzpCShX',EMAIL='serv.omegaacesso@gmail.com';
const SENHA='omega2026',T=['mecanicos','veiculos','revisoes','ordens_servico'];
const $=s=>document.querySelector(s),D=$('#dlg');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16));
const U=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0');
const dia=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const hoje=()=>dia(0),fd=d=>d?d.split('-').reverse().join('/'):'—';
const fk=n=>n===''||n==null?'—':Number(n).toLocaleString('pt-BR')+' km';
const fm=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),flat=s=>norm(s).replace(/[^a-z0-9]/g,'');
let S,P={user:null,mec:false},view={tab:'vei',id:null,q:''},online=false,busy=false,pend=null,sb=null,lerr='';
try{if(window.supabase&&SUPABASE_URL)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}

/* ---------- dados locais (cache) e fila de sincronização ---------- */
function seed(){
 const V=(n,placa,chassi,marca,modelo,ano,cor,km,setor)=>({id:U(n),placa,chassi,marca,modelo,ano,cor,km,setor});
 const R=(n,v,d,tipo,km,descricao,pecas,custo,prox_km,prox_data,mecanico_nome)=>({id:U(n),veiculo_id:U(v),data:dia(-d),tipo,km,descricao,pecas,custo,prox_km,prox_data,mecanico_nome});
 const s={me:null,q:[],
 mecanicos:[{id:U(1),nome:'Rafael Lima'},{id:U(2),nome:'Camila Souza'},{id:U(3),nome:'Joaquim Prado'}],
 veiculos:[V(11,'QRX4F82','9BVAG20C0MS123456','Volvo','FH 540',2021,'Branco',184200,'Cavalos, frota Sul'),V(12,'BRA2E19','93YMAFL4EJJ654321','Fiat','Fiorino',2022,'Prata',32500,'Entregas urbanas'),V(13,'GHT7B05','8AC906655KE112233','Mercedes-Benz','Sprinter 415',2019,'Branco',98900,'Transporte de equipe'),V(14,'OMG1A23','9531M82W0LR778899','Volkswagen','Delivery 11.180',2020,'Azul',12400,'Reserva')],
 revisoes:[R(21,11,210,'preventiva',162000,'Troca de óleo do motor e dos filtros (óleo, combustível e ar). Reaperto das rodas.','Óleo 15W40 (38 L), 3 filtros',2890,182000,null,'Rafael Lima'),
  R(22,11,60,'corretiva',178500,'Substituição da mangueira do turbo, que estava com vazamento.','Mangueira do turbo, abraçadeiras',640,null,null,'Camila Souza'),
  R(23,12,40,'preventiva',31800,'Revisão dos 30 mil km: óleo, filtros e pastilhas dianteiras.','Óleo 5W30, filtros, pastilhas',1180,40000,dia(25),'Joaquim Prado'),
  R(24,13,15,'preventiva',98000,'Troca de óleo, filtros e fluido de freio.','Óleo 10W40, filtros, fluido DOT4',1520,108000,dia(150),'Rafael Lima')],
 ordens_servico:[{id:U(31),veiculo_id:U(13),descricao:'Ruído na suspensão dianteira ao passar em lombadas.',prioridade:'normal',solicitante:'Marcos (logística)',data:dia(-2),status:'aberta',resolvida_em:null,resolvida_por:null}]};
 T.forEach(t=>s[t].forEach(row=>s.q.push({t,op:'up',row})));return s}
const save=()=>{try{localStorage.setItem('omega-v2',JSON.stringify(S))}catch(e){}};
function load(){try{S=JSON.parse(localStorage.getItem('omega-v2'))}catch(e){S=null}if(!S||!S.veiculos){S=seed();save()}}
const put=(t,row)=>{const i=S[t].findIndex(x=>x.id===row.id);i<0?S[t].push(row):S[t][i]=row;S.q.push({t,op:'up',row});save();sync()};
const del=(t,id)=>{S[t]=S[t].filter(x=>x.id!==id);S.q=S.q.filter(o=>!(o.row&&(o.row.id===id||o.row.veiculo_id===id)));S.q.push({t,op:'del',id});save();sync()};
async function sync(manual){
 if(busy)return;busy=true;paint();
 try{
  if(!sb||!P.user)throw new Error('Supabase não configurado ou sem login');
  while(S.q.length){const o=S.q[0],r=o.op==='del'?await sb.from(o.t).delete().eq('id',o.id):await sb.from(o.t).upsert(o.row);if(r.error)throw r.error;S.q.shift();save()}
  for(const t of T){const r=await sb.from(t).select('*');if(r.error)throw r.error;S[t]=r.data}
  save();online=true;if(manual)toast('Sincronizado com o Supabase')
 }catch(e){online=false;if(manual)toast('Servidor indisponível. Seus dados seguem salvos neste aparelho.')}
 busy=false;paint();if(P.user&&!D.open)renderMain(false)}
function paint(){const p=$('#pill');if(!p)return;const n=S.q.length;
 p.className='pill'+(busy?' busy':'');p.title=online?'Conectado ao Supabase':'Sem conexão com o servidor Supabase';
 p.innerHTML=`<span class="dot ${online?'on':'off'}"></span>${busy?'Sincronizando':online?'Online':'Offline'}${n?', '+n+' pendente'+(n>1?'s':''):''}<button data-a="sync" aria-label="Sincronizar agora"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>`}

/* ---------- regras ---------- */
function info(v){
 const rs=S.revisoes.filter(r=>r.veiculo_id===v.id).sort((a,b)=>b.data.localeCompare(a.data)||b.km-a.km);
 const km=Math.max(v.km||0,...rs.map(r=>r.km)),u=rs[0],own=v.prox_km||v.prox_data,pk=own?v.prox_km:u&&u.prox_km,pd=own?v.prox_data:u&&u.prox_data;
 let st=u||pk||pd?'ok':'sem';
 if(st==='ok'){const d=pd?(new Date(pd)-new Date(hoje()))/864e5:null;
  if((pk&&km>=pk)||(d!==null&&d<0))st='venc';else if((pk&&pk-km<=1000)||(d!==null&&d<=30))st='prox'}
 return{rs,km,u,st,pk,pd}}

 <form data-f="perfil"><label>Ainda não tem perfil?<input name="nome" required placeholder="Seu nome completo"></label><div class="ac"><button class="btn pri">Criar perfil e continuar</button></div></form>`)}
function done(){D.close();paintHead();const f=pend;pend=null;if(f)f();else renderMain(true)}

/* ---------- ações (clique) e formulários (submit) ---------- */
const X={
 close:()=>{pend=null;D.close()},sync:()=>sync(true),
 go:t=>{const f=()=>{view.tab=t;view.id=null;renderMain(true);paintHead();scrollTo(0,0)};t==='eq'?gate(f):f()},
 abrir:id=>{view.id=id||null;renderMain(true);scrollTo(0,0)},
 choose:id=>{S.me=id;save();done()},
 offline:()=>{P.user=($('#em')||{}).value||'Visitante';try{localStorage.setItem('omega-user',P.user)}catch(e){}app();sync();splash()},
 sair:()=>{try{localStorage.removeItem('omega-user')}catch(e){}if(sb)sb.auth.signOut();P={user:null,mec:false};online=false;lerr='';view={tab:'vei',id:null,q:''};app()},
 perfil:()=>gate(()=>{}),
 novoVei:()=>gate(()=>formVei()),editar:id=>gate(()=>formVei(S.veiculos.find(x=>x.id===id))),novaRev:id=>gate(()=>formRev(id)),novaOS:()=>formOS(),
 resolver:id=>gate(()=>{const o=S.ordens_servico.find(x=>x.id===id);formRev(o.veiculo_id,o)}),
 excluir:id=>gate(()=>{const v=S.veiculos.find(x=>x.id===id),n=S.revisoes.filter(r=>r.veiculo_id===id).length;
  modal(`<h3>Excluir ${esc(v.placa)}?</h3><p>${esc(v.marca)} ${esc(v.modelo)} será removido com ${n} ${n===1?'revisão':'revisões'} e as OS dele, aqui e no Supabase. Esta ação não pode ser desfeita.</p><div class="ac"><button class="btn" data-a="close">Cancelar</button><button class="btn dg" data-a="excluirOk" data-p="${id}">Excluir veículo</button></div>`)}),
 excluirOk:id=>{S.revisoes=S.revisoes.filter(r=>r.veiculo_id!==id);S.ordens_servico=S.ordens_servico.filter(o=>o.veiculo_id!==id);del('veiculos',id);D.close();view.id=null;renderMain(true);toast('Veículo excluído')},
 editMec:id=>{const m=S.mecanicos.find(x=>x.id===id);if(m)modal(`<form data-f="editMec"><input type="hidden" name="id" value="${m.id}"><h3>Editar perfil</h3><p class="mu">O novo nome também passa a valer nas revisões que ele já registrou.</p><label>Nome do mecânico<input name="nome" required value="${esc(m.nome)}" autofocus></label><p class="err" id="ferr"></p><div class="ac"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">Salvar perfil</button></div></form>`)},
 delMec:id=>{const m=S.mecanicos.find(x=>x.id===id);if(!m)return;if(S.mecanicos.length<2)return toast('Mantenha pelo menos um mecânico na equipe');
  const n=S.revisoes.filter(r=>r.mecanico_nome===m.nome).length;
  modal(`<h3>Excluir ${esc(m.nome)}?</h3><p>O perfil sai da equipe${m.id===S.me?' e você vai precisar escolher outro perfil':''}. O histórico dele (${n} ${n===1?'revisão':'revisões'}) continua nos veículos, com o nome dele.</p><div class="ac"><button class="btn" data-a="close">Cancelar</button><button class="btn dg" data-a="delMecOk" data-p="${id}">Excluir perfil</button></div>`)},
 delMecOk:id=>{del('mecanicos',id);paintHead();renderMain(true);toast('Perfil excluído');if(S.me===id){S.me=null;save();paintHead();pend=null;perfis()}else D.close()}
};
const F={
 async login(f){const em=f.email.value.trim(),btn=f.querySelector('button');btn.disabled=true;
  if(!sb)lerr='Supabase ainda não está configurado neste arquivo.';
  else{const r=await sb.auth.signInWithPassword({email:em,password:f.pw.value});
   if(!r.error){P.user=em;try{localStorage.setItem('omega-user',em)}catch(e){}app();sync();splash();return}
   lerr=r.error.status?'E-mail ou senha incorretos.':'Sem conexão com o servidor Supabase.'}
  app(true,em)},
 pw:f=>{if(f.pw.value===SENHA){P.mec=true;done()}else $('#ferr').textContent='Senha incorreta. Peça a senha atual à chefia da oficina.'},
 editMec:f=>{const id=f.id.value,nome=f.nome.value.trim(),m=S.mecanicos.find(x=>x.id===id);if(!m)return D.close();
  if(S.mecanicos.some(x=>x.id!==id&&norm(x.nome)===norm(nome)))return $('#ferr').textContent='Já existe um mecânico com este nome.';
  const old=m.nome;put('mecanicos',{...m,nome});
  if(old!==nome){S.revisoes.filter(r=>r.mecanico_nome===old).forEach(r=>put('revisoes',{...r,mecanico_nome:nome}));S.ordens_servico.filter(o=>o.resolvida_por===old).forEach(o=>put('ordens_servico',{...o,resolvida_por:nome}))}
  D.close();paintHead();renderMain(true);toast('Perfil atualizado')},
 perfil:f=>{const m={id:rid(),nome:f.nome.value.trim()};put('mecanicos',m);S.me=m.id;save();done()},
 vei:f=>{const id=f.id.value,p=f.placa.value.toUpperCase().replace(/[^A-Z0-9]/g,''),c=f.chassi.value.toUpperCase().trim(),er=m=>$('#ferr').textContent=m;
  if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p))return er('Placa inválida. Use o formato ABC1D23 ou ABC1234.');
  if(S.veiculos.some(v=>v.placa===p&&v.id!==id))return er('Já existe um veículo com esta placa.');
  if(c&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(c))return er('Chassi inválido. Ele tem 17 caracteres, sem as letras I, O e Q.');
  if(c&&S.veiculos.some(v=>v.chassi===c&&v.id!==id))return er('Já existe um veículo com este chassi.');
  const old=S.veiculos.find(x=>x.id===id)||{},cur=Math.max(+f.km.value,id?info(old).km:0);
  if(f.pkm.value&&+f.pkm.value<=cur)return er('A próxima revisão em km precisa ser maior que o km atual ('+fk(cur)+').');
  const v={...old,id:id||rid(),placa:p,chassi:c||null,marca:f.marca.value.trim(),modelo:f.modelo.value.trim(),ano:+f.ano.value,cor:f.cor.value.trim(),km:+f.km.value,setor:f.setor.value.trim(),prox_km:+f.pkm.value||null,prox_data:f.pdata.value||null};
  put('veiculos',v);D.close();view.tab='vei';view.id=v.id;renderMain(true);toast(id?'Veículo atualizado':'Veículo cadastrado')},
 rev:f=>{const v=S.veiculos.find(x=>x.id===f.vid.value),atual=info(v).km,km=+f.km.value,er=m=>$('#ferr').textContent=m;
  if(km<atual)return er(`O km informado (${fk(km)}) é menor que a última leitura (${fk(atual)}). Confira o odômetro.`);
  if(f.pkm.value&&+f.pkm.value<=km)return er('O km da próxima revisão precisa ser maior que o km desta revisão.');
  const r={id:rid(),veiculo_id:v.id,data:f.data.value,tipo:f.tipo.value,km,descricao:f.desc.value.trim(),pecas:f.pecas.value.trim(),custo:+f.custo.value||0,prox_km:+f.pkm.value||null,prox_data:f.pdata.value||null,mecanico_nome:f.resp.value};
  put('revisoes',r);if(r.prox_km||r.prox_data)put('veiculos',{...v,prox_km:r.prox_km,prox_data:r.prox_data});
  if(f.os.value){const o=S.ordens_servico.find(x=>x.id===f.os.value);put('ordens_servico',{...o,status:'resolvida',resolvida_em:r.data,resolvida_por:r.mecanico_nome})}
  D.close();view.tab='vei';view.id=v.id;renderMain(true);toast('Revisão registrada')},
 os:f=>{put('ordens_servico',{id:rid(),veiculo_id:f.vid.value,descricao:f.desc.value.trim(),prioridade:f.prio.value,solicitante:f.sol.value.trim(),data:hoje(),status:'aberta',resolvida_em:null,resolvida_por:null});D.close();view.tab='os';renderMain(true);paintHead();toast('OS aberta')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&X[b.dataset.a])X[b.dataset.a](b.dataset.p)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();F[f.dataset.f](f)}});

/* ---------- formulários ---------- */
function formVei(v){v=v||{};const g=k=>esc(v[k]==null?'':v[k]);modal(`<form data-f="vei"><input type="hidden" name="id" value="${g('id')}"><h3>${v.id?'Editar veículo':'Novo veículo'}</h3><p class="mu">A placa é o principal identificador na busca.</p>
 <div class="g2"><label>Placa<input name="placa" required maxlength="8" placeholder="ABC1D23" value="${g('placa')}" style="text-transform:uppercase"></label><label>Chassi (17 caracteres)<input name="chassi" maxlength="17" value="${g('chassi')}" style="text-transform:uppercase"></label></div>
 <div class="g2"><label>Marca<input name="marca" required value="${g('marca')}"></label><label>Modelo<input name="modelo" required value="${g('modelo')}"></label></div>
 <div class="g2"><label>Ano<input name="ano" type="number" min="1980" max="2100" required value="${g('ano')}"></label><label>Cor<input name="cor" required value="${g('cor')}"></label></div>
 <div class="g2"><label>Km atual<input name="km" type="number" min="0" required value="${g('km')}"></label><label>Setor ou identificação<input name="setor" value="${g('setor')}"></label></div>
 <div class="g2"><label>Próxima revisão (km)<input name="pkm" type="number" min="0" value="${g('prox_km')}"></label><label>Próxima revisão (data)<input name="pdata" type="date" value="${g('prox_data')}"></label></div>
 <p class="mu" style="font-size:14px;margin:0 0 6px">Em branco, vale o que foi previsto na última revisão.</p>
 <p class="err" id="ferr"></p><div class="ac"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">Salvar veículo</button></div></form>`)}
function formRev(vid,o){const v=S.veiculos.find(x=>x.id===vid);
 modal(`<form data-f="rev"><input type="hidden" name="vid" value="${vid}"><input type="hidden" name="os" value="${o?o.id:''}"><h3>${o?'Resolver OS e registrar revisão':'Nova revisão'}</h3><p class="mu">${esc(v.placa)}, ${esc(v.marca)} ${esc(v.modelo)}</p>
 <div class="g2"><label>Tipo<select name="tipo"><option value="preventiva">Preventiva</option><option value="corretiva" ${o?'selected':''}>Corretiva</option></select></label><label>Data<input type="date" name="data" value="${hoje()}" max="${hoje()}" required></label></div>
 <label>Km na revisão<input type="number" name="km" min="0" required value="${info(v).km}"></label>
 <label>O que foi feito<textarea name="desc" rows="3" required>${o?esc('Resposta à OS: '+o.descricao+'\n'):''}</textarea></label>
 <label>Peças e materiais<textarea name="pecas" rows="2"></textarea></label>
 <label>Custo (R$)<input type="number" name="custo" min="0" step="0.01"></label>
 <div class="g2"><label>Próxima revisão (km)<input type="number" name="pkm" min="0"></label><label>Próxima revisão (data)<input type="date" name="pdata" min="${hoje()}"></label></div>
 <label>Mecânico responsável<select name="resp">${S.mecanicos.map(m=>`<option ${m.id===S.me?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label>
 <p class="err" id="ferr"></p><div class="ac"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">Salvar revisão</button></div></form>`)}
function formOS(){modal(`<form data-f="os"><h3>Abrir OS</h3>
 <label>Veículo<select name="vid" required>${[...S.veiculos].sort((a,b)=>a.placa.localeCompare(b.placa)).map(v=>`<option value="${v.id}">${esc(v.placa)}, ${esc(v.marca)} ${esc(v.modelo)}</option>`).join('')}</select></label>

 <div class="ac"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">Abrir OS</button></div></form>`)}

/* ---------- telas ---------- */
function app(anim,em){
 const A=$('#app');
 if(!P.user){A.innerHTML=`<div class="login">${mark('',84)}<h1 style="--i:1">Omega Service</h1><p class="mu" style="--i:2">Histórico de revisões da oficina</p>
 <form data-f="login" style="--i:3"><input type="hidden" id="em" name="email" value="${EMAIL}"><label>Senha de acesso<input type="password" name="pw" required autocomplete="current-password" autofocus></label><p class="err">${esc(lerr)}</p><button class="btn pri">Entrar</button></form>
 ${lerr?`<button class="btn" data-a="offline" style="--i:4">Continuar sem conexão</button><p class="mu" style="font-size:14px;--i:5">O modo sem conexão usa os dados salvos neste aparelho e sincroniza quando o servidor voltar.</p>`:''}</div>`;return}
 A.innerHTML=`<header><div class="lg">${mark('',32)}Omega Service</div><div id="pill"></div><button class="hb" data-a="sair">Sair</button></header><div id="nav"></div><main id="main"></main>`;
 paint();paintHead();renderMain(true)}
function paintHead(){const n=$('#nav');if(!n)return;
 const tabs=[['vei','Veículos'],['os','Ordens de serviço'],['eq','Equipe']];
 n.innerHTML=`<nav>${tabs.map(t=>`<button ${view.tab===t[0]?'aria-current="page"':''} data-a="go" data-p="${t[0]}">${t[1]}</button>`).join('')}</nav>`+(P.mec?`<nav style="margin-top:8px"><button data-a="perfil" style="flex:none;padding:4px 12px;font-size:14px">Mecânico: ${esc(nomeMec())}, trocar perfil</button></nav>`:'')}
function renderMain(anim){const M=$('#main');if(!M)return;M.className=anim?'in':'';
 M.innerHTML=view.tab==='vei'?(view.id?veiDet():veiLista()):view.tab==='os'?osLista():equipe()}

function match(v,q){const t=[v.placa,v.chassi,v.marca,v.modelo,v.ano,v.cor,v.setor].join(' ');return norm(t).includes(norm(q))||(flat(q)&&flat(t).includes(flat(q)))}
function veiRows(anim){
 const ord={venc:0,prox:1,ok:2,sem:3};
 const L=S.veiculos.filter(v=>!view.q||match(v,view.q)).map(v=>({v,i:info(v)})).sort((a,b)=>ord[a.i.st]-ord[b.i.st]||a.v.placa.localeCompare(b.v.placa));
 if(!L.length)return`<p class="mu">${S.veiculos.length?`Nenhum veículo encontrado para “${esc(view.q)}”. Cadastre-o com o botão Novo veículo.`:'Nenhum veículo cadastrado. Use Novo veículo para começar o histórico.'}</p>`;
 return L.map(({v,i},n)=>`<button class="row ${i.st}" data-a="abrir" data-p="${v.id}" ${anim===false?'':`style="animation:rise .5s both;animation-delay:${n*50}ms"`}>${plate(v.placa)}<span class="rt"><b>${esc(v.marca)} ${esc(v.modelo)}</b><span>${esc(v.ano)}, ${esc(v.cor)}, ${fk(i.km)}</span><span>${i.u?'Última revisão em '+fd(i.u.data):'Nenhuma revisão registrada'}</span></span><em class="bd b-${ST[i.st][1]}">${ST[i.st][0]}</em></button>`).join('')}
function veiLista(){
 const venc=S.veiculos.filter(v=>info(v).st==='venc').length;
 return`<div class="bar"><input id="q" type="search" placeholder="Buscar por placa, chassi, modelo, cor…" value="${esc(view.q)}" aria-label="Buscar veículo" autocomplete="off"><button class="btn pri" data-a="novoVei">Novo veículo</button></div>
 <p class="mu" style="margin:0 0 12px;--i:1">${S.veiculos.length} veículos, ${venc} com revisão vencida</p><div id="lista">${veiRows(true)}</div>`}
function veiDet(){
 const v=S.veiculos.find(x=>x.id===view.id);if(!v){view.id=null;return veiLista()}const i=info(v),u=i.u;
 return`<button class="link" data-a="abrir">Voltar para veículos</button>
 <div class="card" style="--i:1"><div class="top">${plate(v.placa,'big')}<div><h2>${esc(v.marca)} ${esc(v.modelo)}</h2><em class="bd b-${ST[i.st][1]}">${ST[i.st][0]}</em></div></div>
 <dl><dt>Chassi</dt><dd>${esc(v.chassi)||'—'}</dd><dt>Ano e cor</dt><dd>${esc(v.ano)}, ${esc(v.cor)}</dd><dt>Km atual</dt><dd>${fk(i.km)}</dd><dt>Setor</dt><dd>${esc(v.setor)||'—'}</dd>
 <dt>Próxima revisão</dt><dd>${i.pk||i.pd?[i.pk?'aos '+fk(i.pk):'',i.pd?'em '+fd(i.pd):''].filter(Boolean).join(' ou '):'não definida'}</dd></dl><p style="margin:12px 0 0"><button class="btn sm" data-a="editar" data-p="${v.id}">Editar veículo</button></p></div>
 <div class="hd" style="justify-content:space-between;--i:2"><h2>Histórico de revisões (${i.rs.length})</h2><button class="btn pri" data-a="novaRev" data-p="${v.id}">Nova revisão</button></div>
 ${i.rs.length?`<ul class="tl" style="--i:3">${i.rs.map((r,n)=>`<li style="--i:${n}"><div class="hd"><b>${fd(r.data)}</b><em class="bd b-${r.tipo==='preventiva'?'ok':'wn'}">${r.tipo==='preventiva'?'Preventiva':'Corretiva'}</em><span class="mu">${fk(r.km)}</span></div>
 <p>${esc(r.descricao)}</p>${r.pecas?`<p class="mu">Peças: ${esc(r.pecas)}</p>`:''}<p class="mu">Responsável: <b>${esc(r.mecanico_nome)}</b>${r.custo?', custo '+fm(r.custo):''}</p></li>`).join('')}</ul>`:'<p class="mu" style="--i:3">Este veículo ainda não tem revisões. Registre a primeira para iniciar o histórico.</p>'}
 <p style="margin-top:20px;--i:4"><button class="btn sm dg" data-a="excluir" data-p="${v.id}">Excluir veículo</button></p>`}
function osLista(){
 const L=[...S.ordens_servico].sort((a,b)=>(a.status==='aberta'?0:1)-(b.status==='aberta'?0:1)||b.data.localeCompare(a.data));
 return`<div class="hd" style="justify-content:space-between;margin-bottom:12px"><h2>Ordens de serviço</h2><button class="btn pri" data-a="novaOS">Abrir OS</button></div>
 ${L.length?L.map((o,n)=>{const v=S.veiculos.find(x=>x.id===o.veiculo_id);if(!v)return'';const ab=o.status==='aberta';return`<div class="card" style="--i:${n+1}"><div class="top" style="margin:0 0 8px">${plate(v.placa)}<div style="flex:1"><b>${esc(v.marca)} ${esc(v.modelo)}</b><br><span class="mu">Aberta por ${esc(o.solicitante)} em ${fd(o.data)}</span></div>
 <em class="bd b-${ab?(o.prioridade==='urgente'?'er':'wn'):'ok'}">${ab?(o.prioridade==='urgente'?'Urgente':'Aberta'):'Resolvida'}</em></div>
 <p style="margin:0 0 ${ab?10:0}px">${esc(o.descricao)}</p>${ab?`<button class="btn sm pri" data-a="resolver" data-p="${o.id}">Resolver e registrar revisão</button>`:`<p class="mu" style="margin:6px 0 0">Resolvida em ${fd(o.resolvida_em)} por ${esc(o.resolvida_por)}. Registrada no histórico do veículo.</p>`}</div>`}).join(''):'<p class="mu">Nenhuma OS aberta. Use Abrir OS para registrar um problema ou pedido de revisão.</p>'}`}
function equipe(){
 return`<h2 style="margin-bottom:12px">Equipe de mecânicos</h2>${S.mecanicos.map((m,n)=>{const c=S.revisoes.filter(r=>r.mecanico_nome===m.nome).length;return`<div class="card" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;--i:${n+1}"><div style="min-width:0"><b>${esc(m.nome)}${m.id===S.me?' (você)':''}</b><br><span class="mu">${c} ${c===1?'revisão':'revisões'}</span></div><div style="display:flex;gap:6px"><button class="btn sm" data-a="editMec" data-p="${m.id}">Editar perfil</button><button class="btn sm dg" data-a="delMec" data-p="${m.id}">Excluir</button></div></div>`}).join('')}
 <form class="card" data-f="perfil" style="margin-top:14px"><label>Adicionar perfil<input name="nome" required placeholder="Nome do mecânico"></label><button class="btn pri">Adicionar e usar este perfil</button></form>`}

load();
try{const u=localStorage.getItem('omega-user');if(u)P.user=u}catch(e){}
app();sync();splash();
addEventListener('online',()=>sync());addEventListener('offline',()=>{online=false;paint()});setInterval(()=>{if(P.user&&!D.open)sync()},30000);
</script>
</body>
</html>
